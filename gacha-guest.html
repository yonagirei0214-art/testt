<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ガチャを引く</title>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --ground:#ECEFF4;--ink:#17203A;--mute:#5E687C;--line:#D9DEE8;--red:#E8412C;--sun:#FFC24B;
  --bg:#ECEFF4;--gold:#9A5B00;--cyan:#2653D9;--pink:#E8412C;--green:#188A5C;
  --font:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',sans-serif;
  --display:'Dela Gothic One','Zen Kaku Gothic New',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;}
body{background:var(--ground);color:var(--ink);font-family:var(--font);line-height:1.5;-webkit-text-size-adjust:100%;}
button{font-family:var(--font);}
button:focus-visible,input:focus-visible{outline:3px solid var(--cyan);outline-offset:2px;}
#particleCanvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:110;}
#flashEl{position:fixed;inset:0;pointer-events:none;z-index:105;opacity:0;transition:opacity .25s;}
.scan-line{display:none;}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:clamp(16px,5vw,32px);z-index:10;transition:opacity .3s ease;}
.screen.hidden{opacity:0;pointer-events:none;}
.logo{font-family:var(--display);font-size:clamp(36px,10vw,54px);line-height:1;text-align:center;margin-bottom:8px;}
.logo-sub{font-size:13px;color:var(--mute);text-align:center;margin-bottom:clamp(22px,5vw,34px);}
.conn-spinner{width:36px;height:36px;border:3px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px;}
@keyframes spin{to{transform:rotate(360deg)}}
.conn-text{font-size:14px;color:var(--mute);text-align:center;}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:clamp(20px,5vw,28px);width:100%;max-width:400px;}
.panel-title{font-size:14px;font-weight:900;margin-bottom:12px;}
.name-input{width:100%;padding:14px 16px;background:var(--ground);border:2px solid transparent;border-radius:12px;color:var(--ink);font-size:16px;font-family:var(--font);outline:none;transition:border-color .15s,background .15s;}
.name-input:focus{border-color:var(--ink);background:#fff;}
.submit-btn{width:100%;margin-top:14px;padding:15px;background:var(--ink);border:0;border-radius:12px;font:900 15px var(--font);color:#fff;cursor:pointer;transition:transform .1s;}
.submit-btn:active{transform:scale(.98);}
.error-box{background:#FDECE9;border-radius:10px;padding:12px 14px;font-size:13px;color:#A6281A;margin-top:10px;font-weight:700;}
#screen-gacha{justify-content:flex-start;padding:0;}
.gacha-wrap{width:100%;height:100%;display:flex;flex-direction:column;}
.gacha-header{padding:16px clamp(18px,5vw,28px) 8px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-shrink:0;}
.g-name{font-size:14px;color:var(--mute);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.g-name span{color:var(--ink);font-weight:900;}
.header-right{display:flex;align-items:flex-end;gap:14px;flex-shrink:0;}
.spins-info{display:flex;align-items:baseline;gap:6px;}
.spins-label{font-size:13px;color:var(--mute);}
.spins-num{font-family:var(--display);font-size:clamp(36px,10vw,46px);line-height:1;font-variant-numeric:tabular-nums;}
.sound-toggle{background:none;border:1px solid #B5BDCE;border-radius:8px;padding:5px 10px;font:700 12px var(--font);cursor:pointer;color:var(--mute);}
.gacha-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 24px 28px;overflow:hidden;}
.gacha-machine-col{display:flex;flex-direction:column;align-items:center;gap:clamp(20px,5vh,34px);width:100%;max-width:340px;}
.capsule{position:relative;width:clamp(150px,40vmin,210px);aspect-ratio:1;border-radius:50%;overflow:hidden;box-shadow:inset -12px -16px 0 rgba(23,32,58,.14);animation:capRock 3.2s ease-in-out infinite;transform-origin:50% 100%;}
.cap-top{position:absolute;left:0;right:0;top:0;bottom:50%;background:var(--red);}
.cap-bot{position:absolute;left:0;right:0;top:50%;bottom:0;background:#fff;}
.capsule::before{content:'';position:absolute;left:0;right:0;top:calc(50% - 4px);height:8px;background:var(--ink);z-index:1;}
.cap-shine{position:absolute;left:16%;top:13%;width:22%;height:11%;border-radius:50%;background:rgba(255,255,255,.55);transform:rotate(-35deg);z-index:2;}
.capsule.mini{width:92px;animation:none;}
@keyframes capRock{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.gacha-btn{width:100%;padding:18px 24px;background:var(--red);border:0;border-radius:16px;font-family:var(--display);font-size:clamp(18px,5vmin,22px);color:#fff;cursor:pointer;box-shadow:0 6px 0 #B52A18;transition:transform .08s,box-shadow .08s;}
.gacha-btn:active{transform:translateY(5px);box-shadow:0 1px 0 #B52A18;}
.gacha-btn:disabled{background:#B9BFCC;box-shadow:0 6px 0 #9AA1B1;cursor:not-allowed;}
.gacha-btn:disabled:active{transform:none;box-shadow:0 6px 0 #9AA1B1;}
.secondary-btns{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;}
.skip-btn{width:100%;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:13px;font:700 14px var(--font);color:var(--ink);cursor:pointer;}
.skip-btn:disabled{opacity:.35;cursor:not-allowed;}
.history-btn{background:none;border:0;padding:6px;font:700 13px var(--font);color:var(--mute);text-decoration:underline;cursor:pointer;}
.cost-hint{font-size:13px;color:var(--mute);text-align:center;}
#overlay{position:fixed;inset:0;background:rgba(23,32,58,.94);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s;padding:clamp(16px,5vw,32px);overflow-y:auto;gap:clamp(10px,2.5vmin,16px);}
#overlay.show{opacity:1;pointer-events:auto;}
.overlay-close{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.14);border:0;border-radius:50%;width:38px;height:38px;font-size:16px;color:#fff;cursor:pointer;}
.card-scene{width:clamp(180px,46vmin,230px);height:clamp(252px,64vmin,322px);perspective:1000px;flex-shrink:0;}
.card-inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform 0s;}
.card-inner.flip{transition:transform .7s cubic-bezier(.4,.2,.2,1);transform:rotateY(180deg);}
.card-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;overflow:hidden;}
.card-back{background:var(--ground);}
.card-back-pattern{display:flex;align-items:center;justify-content:center;}
.card-front{transform:rotateY(180deg);background:#fff;border:4px solid #fff;gap:8px;color:var(--ink);}
.card-rarity-label{font-weight:900;font-size:14px;padding:3px 14px;border-radius:6px;color:#fff;white-space:nowrap;}
.card-prize-emoji{font-size:12px;font-weight:700;color:var(--mute);}
.card-prize-name{font-size:clamp(15px,4vmin,18px);font-weight:900;text-align:center;line-height:1.35;max-width:100%;}
.card-prize-text{font-size:13px;text-align:center;color:var(--mute);line-height:1.5;max-width:100%;word-break:break-word;border-top:1px solid var(--line);padding-top:8px;margin-top:2px;display:none;}
@keyframes shake{0%,100%{transform:translateX(0) rotate(0)}20%{transform:translateX(-7px) rotate(-3deg)}40%{transform:translateX(7px) rotate(3deg)}60%{transform:translateX(-5px) rotate(-2deg)}80%{transform:translateX(4px) rotate(1deg)}}
.shaking{animation:shake .85s ease-in-out;}
.overlay-info{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:300px;}
.result-label{font-family:var(--display);font-size:clamp(20px,6vmin,26px);text-align:center;color:#fff;opacity:0;transition:opacity .4s;min-height:1.3em;}
.result-label.show{opacity:1;}
.dl-btn,.again-btn,.to-results-btn,.skip-overlay-btn,.skip-all-btn{width:100%;padding:14px;border-radius:12px;font:900 14px var(--font);cursor:pointer;opacity:0;pointer-events:none;border:2px solid transparent;}
.dl-btn{background:var(--sun);color:var(--ink);}
.again-btn,.to-results-btn{background:#fff;color:var(--ink);}
.skip-overlay-btn,.skip-all-btn{background:none;border-color:rgba(255,255,255,.35);color:#fff;padding:11px;font-weight:700;font-size:13px;}
.dl-btn.ready,.again-btn.ready,.to-results-btn.ready,.skip-overlay-btn.show,.skip-all-btn.show{opacity:1;pointer-events:auto;animation:popIn .3s ease-out;}
@keyframes popIn{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes bonusToastIn{from{transform:translateX(-50%) scale(.6);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
#screen-spinning{background:var(--ground);}
.fast-title{font-family:var(--display);font-size:clamp(20px,6vw,26px);text-align:center;}
.fast-sub{font-size:13px;color:var(--mute);text-align:center;margin:6px 0 24px;}
.fast-bar-wrap{width:100%;max-width:260px;height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:0 auto;}
.fast-bar-fill{width:40%;height:100%;background:var(--ink);border-radius:3px;animation:slide 1.1s ease-in-out infinite;}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
.fast-actions{display:flex;flex-direction:column;align-items:center;margin-top:28px;min-height:44px;}
.fast-cancel{background:none;border:1px solid #B5BDCE;border-radius:10px;padding:10px 24px;font:700 13px var(--font);color:var(--mute);cursor:pointer;}
#screen-results,#screen-history{justify-content:flex-start;padding:0;align-items:stretch;}
.results-wrap,.history-wrap{width:100%;max-width:640px;margin:0 auto;height:100%;display:flex;flex-direction:column;}
.results-header,.history-header{padding:20px 20px 12px;flex-shrink:0;}
.results-title,.history-title{font-family:var(--display);font-size:clamp(22px,6vw,28px);margin-bottom:8px;}
.history-sub{font-size:13px;color:var(--mute);}
.results-stats{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.rstat{font-weight:900;font-size:12px;padding:3px 10px;border-radius:999px;}
.results-list,.history-list{flex:1;overflow-y:auto;padding:0 20px;min-height:0;}
.result-item,.history-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);}
.ri-badge,.hi-badge{font-weight:900;font-size:11px;padding:3px 9px;border-radius:5px;color:#fff;white-space:nowrap;flex-shrink:0;}
.ri-info,.hi-info{flex:1;min-width:0;}
.ri-name,.hi-name{font-size:14px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ri-text,.hi-text{font-size:12px;color:var(--mute);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ri-actions{display:flex;gap:6px;flex-shrink:0;align-items:center;}
.ri-count{font-weight:900;font-variant-numeric:tabular-nums;color:var(--mute);font-size:13px;}
.ri-wait{font-size:12px;color:var(--mute);}
.ri-dl,.hi-dl{background:var(--ink);color:#fff;border:0;border-radius:8px;padding:7px 12px;font:700 12px var(--font);cursor:pointer;}
.ri-copy,.hi-copy{background:#fff;color:var(--ink);border:1px solid #B5BDCE;border-radius:8px;padding:7px 12px;font:700 12px var(--font);cursor:pointer;}
.results-footer,.history-footer{padding:12px 20px calc(env(safe-area-inset-bottom,0px) + 14px);flex-shrink:0;display:flex;flex-direction:column;gap:8px;background:var(--ground);border-top:1px solid var(--line);}
.batch-dl-btn{background:var(--ink);border:0;border-radius:12px;padding:14px;font:900 14px var(--font);color:#fff;cursor:pointer;width:100%;}
.batch-dl-btn:disabled{opacity:.45;cursor:not-allowed;}
.close-results-btn,.hist-back-btn{background:#fff;border:1px solid #B5BDCE;border-radius:12px;padding:12px;font:700 14px var(--font);color:var(--ink);cursor:pointer;width:100%;}
.hist-clear-btn{background:none;border:0;padding:8px;font:700 12px var(--font);color:#B3321F;cursor:pointer;width:100%;}
.history-session{margin-bottom:6px;}
.history-session-hdr{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--mute);padding:14px 0 2px;}
.empty-history{text-align:center;padding:40px 20px;color:var(--mute);font-size:14px;}
@media(min-width:768px){
  #overlay{flex-direction:row;gap:48px;}
  .overlay-info{align-items:flex-start;}
}
::-webkit-scrollbar{width:6px;}::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#C5CCDA;border-radius:3px;}
.hidden{display:none!important;}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;}}

}

}

    radial-gradient(circle at 50% 38%,rgba(255,61,113,.13),transparent 35%),

}

}

}

</style>

<body>
<canvas id="particleCanvas"></canvas>
<div id="flashEl"></div>
<div class="scan-line" id="scanLine"></div>

<!-- OVERLAY -->
<div id="overlay">
  <button class="overlay-close" onclick="forceCloseOverlay()">✕</button>
  <div class="card-scene">
    <div class="card-inner" id="cardInner">
      <div class="card-face card-back"><div class="card-back-pattern"><div class="capsule mini"><i class="cap-top"></i><i class="cap-bot"></i></div></div></div>
      <div class="card-face card-front" id="cardFront">
        <span class="card-rarity-label" id="cardRarityLabel"></span>
        <div class="card-prize-emoji" id="cardEmoji"></div>
        <div class="card-prize-name" id="cardPrizeName"></div>
        <div class="card-prize-text" id="cardPrizeText"></div>
      </div>
    </div>
  </div>
  <div class="overlay-info">
    <div class="result-label" id="resultLabel"></div>
    <button class="dl-btn" id="dlBtn">このファイルをDL</button>
    <button class="again-btn" id="nextBtn" onclick="nextSpin()">次を引く</button>
    <button class="to-results-btn" id="toResultsBtn" onclick="showResults()">リザルトを見る</button>
    <button class="skip-overlay-btn" id="skipOverlayBtn" onclick="skipToFast()">残りをまとめて引く</button>
    <button class="skip-all-btn" id="skipAllBtn" onclick="skipAll()">ここまでの結果を見る</button>
  </div>
</div>

<!-- 接続中 -->
<div class="screen" id="screen-connecting">
  <div class="logo">GACHA</div>
  <div class="logo-sub">POWERED BY P2P</div>
  <div class="conn-spinner"></div>
  <div class="conn-text" id="connText">ルームに接続中...</div>
</div>

<!-- 名前入力 -->
<div class="screen hidden" id="screen-name">
  <div class="logo">GACHA</div>
  <div class="logo-sub">あなたの名前を入力</div>
  <div class="panel">
    <div class="panel-title">リスナー名</div>
    <input class="name-input" type="text" id="nameInput" placeholder="配信で使っている名前" autocomplete="off" maxlength="30">
    <div id="pinWrap" style="display:none;margin-top:10px;">
      <div class="panel-title" style="font-size:12px;margin-bottom:8px;">PIN</div>
      <input class="name-input" type="text" id="pinInput" placeholder="ライバーから受け取ったPIN" autocomplete="off" maxlength="8"
        style="letter-spacing:0.2em;text-transform:uppercase;">
    </div>
    <div id="nameError"></div>
    <button class="submit-btn" onclick="submitName()">接続する</button>
  </div>
</div>

<!-- ガチャ本体 -->
<div class="screen hidden" id="screen-gacha">
  <div class="gacha-wrap">
    <div class="gacha-header">
      <div class="g-name">こんにちは、<span id="playerName">-</span></div>
      <div class="header-right">

<script>

/* ===== PARTICLES ===== */
const pCanvas=document.getElementById('particleCanvas'),pCtx=pCanvas.getContext('2d');
const rpCanvas=()=>{pCanvas.width=innerWidth;pCanvas.height=innerHeight;};
window.addEventListener('resize',rpCanvas);rpCanvas();
let particles=[];
function lighten(hex,a){const n=parseInt(hex.replace('#',''),16);return`#${Math.min(255,((n>>16)&0xff)+a).toString(16).padStart(2,'0')}${Math.min(255,((n>>8)&0xff)+a).toString(16).padStart(2,'0')}${Math.min(255,(n&0xff)+a).toString(16).padStart(2,'0')}`;}
function spawnParticles(x,y,color,count){
  const pal=[color,lighten(color,60),'#fff',lighten(color,30)];
  for(let i=0;i<count;i++){const a=Math.random()*Math.PI*2,sp=Math.random()*11+3;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-5,color:pal[Math.floor(Math.random()*pal.length)],life:1,decay:Math.random()*0.018+0.01,size:Math.random()*8+2,star:Math.random()>0.5});}
}
(function animP(){
  pCtx.clearRect(0,0,pCanvas.width,pCanvas.height);particles=particles.filter(p=>p.life>0);
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.38;p.vx*=0.97;p.life-=p.decay;
    pCtx.globalAlpha=Math.max(0,p.life);pCtx.fillStyle=p.color;
    if(p.star){pCtx.save();pCtx.translate(p.x,p.y);pCtx.rotate(Date.now()*0.003);pCtx.beginPath();
      for(let i=0;i<5;i++){const a=-Math.PI/2+i*Math.PI*2/5,b=a+Math.PI/5,r=p.size*p.life;i===0?pCtx.moveTo(Math.cos(a)*r,Math.sin(a)*r):pCtx.lineTo(Math.cos(a)*r,Math.sin(a)*r);pCtx.lineTo(Math.cos(b)*(r*0.4),Math.sin(b)*(r*0.4));}
      pCtx.closePath();pCtx.fill();pCtx.restore();}
    else{pCtx.beginPath();pCtx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);pCtx.fill();}});
  requestAnimationFrame(animP);
})();

/* ===== AUDIO ===== */
let soundEnabled=true;let _actx=null;
function toggleSound(){soundEnabled=!soundEnabled;document.getElementById('soundToggle').textContent=soundEnabled?'音 ON':'音 OFF';}
function playSound(win){
  if(!soundEnabled)return;
  try{_actx=_actx||new(window.AudioContext||window.webkitAudioContext)();const ctx=_actx;if(ctx.state==='suspended')ctx.resume();
    (win?[523,659,784,1047,1319]:[330,294]).forEach((f,i)=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);o.frequency.value=f;o.type='sine';
      const t=ctx.currentTime+i*0.1;
      g.gain.setValueAtTime(0.25,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.7);
      o.start(t);o.stop(t+0.8);});
  }catch(e){}
}

/* ===== BONUS TOAST ===== */
function showBonusToast(n){
  const el=document.createElement('div');
  el.style.cssText=`position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translateX(-50%);
    background:#FFC24B;color:#17203A;font-weight:900;padding:10px 22px;
    border-radius:12px;font-size:clamp(11px,3.5vw,13px);
    z-index:9999;white-space:nowrap;box-shadow:0 6px 0 rgba(23,32,58,.25);
    pointer-events:none;animation:bonusToastIn 0.4s cubic-bezier(0.34,1.56,0.64,1);`;
  el.textContent=`ボーナス獲得！ +${n}回 無料`;
  document.body.appendChild(el);
  setTimeout(()=>{el.style.transition='opacity 0.4s';el.style.opacity='0';setTimeout(()=>el.remove(),400);},2400);
}

/* ===== HTML ESCAPE ===== */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

/* ===== INDEXEDDB (GUEST HISTORY) ===== */
const HIST_DB='gacha-guest-prizes';
const HIST_STORE='prizes';
let _histDb=null;

function openHistDb(){
  return new Promise((res,rej)=>{
    const req=indexedDB.open(HIST_DB,1);
    req.onupgradeneeded=e=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains(HIST_STORE)){
        const store=db.createObjectStore(HIST_STORE,{keyPath:'id',autoIncrement:true});
        store.createIndex('sessionId','sessionId');
      }
    };
    req.onsuccess=e=>{_histDb=e.target.result;res(_histDb);};
    req.onerror=rej;
  });
}

async function savePrizeToHistory(result,sessionId,sessionLabel){
  if(!_histDb||!result.arrayBuffer)return;
  try{
    const tx=_histDb.transaction(HIST_STORE,'readwrite');
    tx.objectStore(HIST_STORE).add({
      sessionId,sessionLabel,
      timestamp:Date.now(),
      rarityName:result.rarity.name,
      rarityColor:result.rarity.color,
      prizeName:result.prize.name,
      prizeText:result.prize.text||'',
      hasFile:true,count:result.count||1,
      dlName:result.dlName,
      dlMime:result.dlMime,
      arrayBuffer:result.arrayBuffer
    });
  }catch(e){console.warn('savePrizeToHistory failed:',e);}
}

async function loadAllHistory(){
  if(!_histDb)return[];
  return new Promise((res,rej)=>{
    const tx=_histDb.transaction(HIST_STORE,'readonly');
    const req=tx.objectStore(HIST_STORE).getAll();
    req.onsuccess=e=>res(e.target.result||[]);
    req.onerror=rej;
  });
}

async function deleteHistItem(id){
  if(!_histDb)return;
  const tx=_histDb.transaction(HIST_STORE,'readwrite');
  tx.objectStore(HIST_STORE).delete(id);
}

async function clearAllHistory(){
  if(!_histDb)return;
  const tx=_histDb.transaction(HIST_STORE,'readwrite');
  tx.objectStore(HIST_STORE).clear();
}

async function checkHistoryExists(){
  if(!_histDb)return false;
  const all=await loadAllHistory();
  return all.length>0;
}

/* ===== STATE ===== */
const st={
  peer:null,conn:null,name:null,remainingSpins:0,costPerSpin:0,
  bonusEvery:null,bonusFree:null,pinRequired:false,
  spinning:false,animDone:false,fileDone:false,
  dlUrl:null,dlName:null,dlMime:'application/octet-stream',
  chunks:[],binaryChunks:[],totalChunks:0,pendingHasFile:false,
  results:[],currentResultIdx:-1,
  fastMode:false,fastTotal:0,fastStartIdx:0,
  sessionId:null,sessionLabel:'',
  ignoreSpins:0,batchPending:0,batchId:0,curPid:null
};

// ZIPの事前生成用
let _zipUrl=null;
let _zipName='gacha-prizes.zip';

/* ===== CONNECTION ===== */
const params=new URLSearchParams(location.search);
const roomId=params.get('room');
let _reconnecting=false;

window.onload=async()=>{
  await openHistDb().catch(()=>{});
  const hasHist=await checkHistoryExists().catch(()=>false);
  if(hasHist){document.getElementById('histBtn').style.display='';}
  if(!roomId){showError('URLにルームIDがありません。\nライバーから受け取ったURLを開いてください。');return;}
  connect();
};

function connect(){
  if(st.peer&&!st.peer.destroyed)st.peer.destroy();
  st.peer=null;st.conn=null;
  setConnText('ルームに接続中...');
  const peer=new Peer({debug:0});
  st.peer=peer;
  peer.on('open',()=>{
    if(peer!==st.peer)return;
    setConnText('ホストに接続中...');
    const conn=peer.connect(roomId,{reliable:true,serialization:'binary'});
    st.conn=conn;
    conn.on('open',()=>{setConnText('接続完了！');showScreen('screen-name');_reconnecting=false;});
    conn.on('data',onData);
    conn.on('close',()=>{
      if(conn!==st.conn)return;
      const cur=getCurrentScreen();
      if(cur==='screen-results'||cur==='screen-history')return;
      setConnText('ホストと再接続中...');
      showScreen('screen-connecting');
      if(!_reconnecting){_reconnecting=true;setTimeout(()=>connect(),3000);}
    });
    conn.on('error',e=>console.warn('conn error:',e));
    setTimeout(()=>{if(conn===st.conn&&!conn.open)showError('ホストに接続できませんでした。\nルームが開かれているか確認してください。');},12000);
  });
  peer.on('error',e=>{
    if(peer!==st.peer)return;
    if(['peer-unavailable','network','server-error','socket-error','socket-closed'].includes(e.type)){
      setConnText('再接続中...');setTimeout(()=>connect(),3000);}
    else showError('接続エラー: '+e.type);
  });
}

function getCurrentScreen(){
  return['screen-connecting','screen-name','screen-gacha','screen-spinning','screen-results','screen-history']
    .find(id=>!document.getElementById(id).classList.contains('hidden'))||'';
}

function onData(data){
  // binary serializationで届くファイル本体
  if(data instanceof ArrayBuffer || ArrayBuffer.isView(data)){
    const u8=data instanceof ArrayBuffer?new Uint8Array(data):new Uint8Array(data.buffer,data.byteOffset,data.byteLength);
    st.binaryChunks.push(u8.slice());
    return;
  }
  if(typeof data!=='object')return;
  switch(data.type){
    case 'welcome':
      st.remainingSpins=data.remainingSpins;st.costPerSpin=data.costPerSpin;
      st.bonusEvery=data.bonusEvery||null;st.bonusFree=data.bonusFree||null;
      st.results=[];st.currentResultIdx=-1;_zipUrl=null;
      st.sessionId='sess-'+Date.now();
      st.sessionLabel=new Date().toLocaleString('ja-JP',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
      // 再接続時の状態リセット
      st.spinning=false;st.animDone=false;st.fileDone=false;
      st.fastMode=false;st.ignoreSpins=0;st.batchPending=0;
      clearTimeout(_spinTimeout);
      document.getElementById('overlay').classList.remove('show');
      document.getElementById('pinInput').value='';
      document.getElementById('playerName').textContent=data.name||st.name;
      document.getElementById('spinsNum').textContent=st.remainingSpins;
      document.getElementById('costHint').textContent=data.costPerSpin+'Pt / 1回'
        +(st.bonusEvery&&st.bonusFree?`　${st.bonusEvery}回ごとに${st.bonusFree}回無料`:'');
      showScreen('screen-gacha');
      setGachaBtn(true);
      break;
    case 'error':
      showScreen('screen-name');
      document.getElementById('nameError').innerHTML=`<div class="error-box">${data.message}</div>`;break;
    case 'spin_result':
      if(st.ignoreSpins>0){st.ignoreSpins--;break;}
      st.pendingHasFile=data.prize.hasFile;
      st.remainingSpins=data.remainingSpins;
      document.getElementById('spinsNum').textContent=st.remainingSpins;
      if(!data.prize.hasFile)st.fileDone=true;
      st.results.push({pid:data.prize.pid,rarity:data.rarity,prize:data.prize,dlUrl:null,dlName:null,dlMime:null,arrayBuffer:null,bonusAwarded:data.bonusAwarded||0});
      st.currentResultIdx=st.results.length-1;
      if(data.bonusAwarded>0)showBonusToast(data.bonusAwarded);
      showCardResult(data.rarity,data.prize);
      break;
    case 'batch_result':onBatchResult(data);break;
    case 'spin_denied':
      if(st.fastMode){st.fastMode=false;st.spinning=false;clearTimeout(_spinTimeout);showScreen('screen-gacha');setGachaBtn(true);alert(data.message||'引けませんでした');}
      else{forceCloseOverlay();alert(data.message||'残り回数がないか、エラーが発生しました。');}
      break;
    case 'file_start':
      st.chunks=[];st.binaryChunks=[];st.totalChunks=data.totalChunks;
      st.dlName=data.fileName;st.dlMime=data.mimeType||'application/octet-stream';st.curPid=data.pid||null;break;
    case 'file_chunk':
      // 旧方式との互換用
      st.chunks[data.i]=data.d;break;
    case 'file_end':
      if(st.binaryChunks.length)buildBinaryFile();
      else buildFile();
      break;
    case 'spins_update':
      st.remainingSpins=data.remainingSpins;
      document.getElementById('spinsNum').textContent=st.remainingSpins;
      if(!st.spinning)setGachaBtn(true);
      break;
    case 'pin_required':
      st.pinRequired=!!data.value;
      document.getElementById('pinWrap').style.display=st.pinRequired?'block':'none';
      document.getElementById('pinInput').value='';
      showScreen('screen-name');
      break;
    case 'pin_setting':
      st.pinRequired=!!data.pinEnabled;
      document.getElementById('pinWrap').style.display=st.pinRequired?'block':'none';
      document.getElementById('pinInput').value='';
      break;
    case 'bonus_update':
      st.bonusEvery=data.bonusEvery||null;
      st.bonusFree=data.bonusFree||null;
      st.costPerSpin=data.costPerSpin||st.costPerSpin;
      document.getElementById('costHint').textContent=st.costPerSpin+'Pt / 1回'
        +(st.bonusEvery&&st.bonusFree?`　${st.bonusEvery}回ごとに${st.bonusFree}回無料`:'');
      break;
  }
}

/* ===== SPIN ===== */
let _spinTimeout=null;
function spin(){
  if(st.spinning||st.remainingSpins<=0)return;
  if(!st.conn?.open){alert('ホストと接続されていません。再接続してください。');return;}
  st.spinning=true;st.animDone=false;st.fileDone=false;
  st.dlUrl=null;st.chunks=[];st.totalChunks=0;st.pendingHasFile=false;
  setGachaBtn(false);
  st.conn.send({type:'spin_request'});
  showOverlay();
  _spinTimeout=setTimeout(()=>{
    if(st.spinning&&!st.fastMode){forceCloseOverlay();alert('タイムアウト：ホストからの返答がありませんでした。');}
  },8000);
}

function setGachaBtn(enabled){
  const btn=document.getElementById('gachaBtn');
  const fBtn=document.getElementById('fastBtn');
  const recv=st.batchPending>0;
  btn.disabled=!enabled||recv;
  if(fBtn)fBtn.disabled=btn.disabled;
  if(recv)btn.textContent='ファイル受信中...';
  else if(!enabled)btn.textContent='引いています...';
  else if(st.remainingSpins<=0){btn.textContent='終了';btn.disabled=true;if(fBtn)fBtn.disabled=true;}
  else btn.textContent='GACHA !';
}

/* ===== OVERLAY ===== */
function resetOverlay(){
  document.getElementById('dlBtn').className='dl-btn';
  document.getElementById('nextBtn').className='again-btn';
  document.getElementById('toResultsBtn').className='to-results-btn';
  document.getElementById('skipOverlayBtn').className='skip-overlay-btn';
  document.getElementById('skipAllBtn').className='skip-all-btn';
  const rl=document.getElementById('resultLabel');rl.className='result-label';rl.textContent='';
  document.getElementById('cardInner').className='card-inner';
  const front=document.getElementById('cardFront');
  front.className='card-face card-front';front.style.border='3px solid rgba(255,255,255,0.3)';front.style.boxShadow='';
  document.getElementById('cardPrizeText').style.display='none';
}

function showOverlay(){resetOverlay();document.getElementById('overlay').classList.add('show');}

function showCardResult(rarity,prize){
  clearTimeout(_spinTimeout);
  const color=rarity.color||'#9900ff';
  const inner=document.getElementById('cardInner');
  inner.classList.remove('shaking');void inner.offsetWidth;inner.classList.add('shaking');
  setTimeout(()=>{
    inner.classList.remove('shaking');
    const front=document.getElementById('cardFront');
    front.style.border=`4px solid ${color}`;front.style.boxShadow='0 14px 40px rgba(0,0,0,.35)';
    const lbl=document.getElementById('cardRarityLabel');
    lbl.textContent=rarity.name;lbl.style.background=color;
    document.getElementById('cardEmoji').textContent=prize.hasFile?'ファイル付き':'メッセージ';
    document.getElementById('cardPrizeName').textContent=prize.name;
    const textEl=document.getElementById('cardPrizeText');
    if(prize.text){textEl.textContent=prize.text;textEl.style.display='block';}else textEl.style.display='none';
    inner.classList.add('flip');
    setTimeout(()=>{
      playSound(true);
      const el=document.getElementById('flashEl');el.style.background=color;el.style.opacity='0.25';
      setTimeout(()=>el.style.opacity='0',80);
      const sl=document.getElementById('scanLine');
      sl.style.background=`linear-gradient(90deg,transparent,${color},transparent)`;
      sl.classList.remove('go');void sl.offsetWidth;sl.classList.add('go');
      spawnParticles(innerWidth/2,innerHeight/2,color,32);
      const rl=document.getElementById('resultLabel');
      rl.textContent=`${rarity.name} 当選！`;
      rl.className='result-label show';
      st.animDone=true;tryShowDl();
    },760);
  },920);
}

function buildBinaryFile(){
  const inBatch=st.batchPending>0&&!!st.curPid;
  try{
    const total=st.binaryChunks.reduce((n,c)=>n+c.byteLength,0);
    const bytes=new Uint8Array(total);
    let off=0;
    for(const chunk of st.binaryChunks){bytes.set(chunk,off);off+=chunk.byteLength;}
    const ab=bytes.buffer.slice(0);
    const url=URL.createObjectURL(new Blob([bytes],{type:st.dlMime}));
    if(inBatch){
      const rs=st.results.filter(r=>r.pid===st.curPid&&r.sessBatch===st.batchId&&!r.arrayBuffer);
      rs.forEach(r=>{r.dlUrl=url;r.dlName=st.dlName;r.dlMime=st.dlMime;r.arrayBuffer=ab;});
      if(rs[0])savePrizeToHistory({...rs[0],count:rs.length},st.sessionId,st.sessionLabel).then(()=>{document.getElementById('histBtn').style.display='';});
    }else{
      st.dlUrl=url;
      if(st.currentResultIdx>=0){
        const r=st.results[st.currentResultIdx];
        r.dlUrl=url;r.dlName=st.dlName;r.dlMime=st.dlMime;r.arrayBuffer=ab;
        savePrizeToHistory(r,st.sessionId,st.sessionLabel).then(()=>{document.getElementById('histBtn').style.display='';});
      }
      st.fileDone=true;tryShowDl();
    }
  }catch(e){console.error('buildBinaryFile error:',e);}
  finally{
    if(inBatch){st.batchPending=Math.max(0,st.batchPending-1);onFileProgress();}
    st.binaryChunks=[];st.chunks=[];
  }
}

function buildFile(){
  const inBatch=st.batchPending>0&&!!st.curPid;
  try{
    const bin=atob(st.chunks.join(''));
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    const ab=bytes.buffer.slice(0);
    const url=URL.createObjectURL(new Blob([bytes],{type:st.dlMime}));
    if(inBatch){
      // まとめ引き：同じ景品の全結果にファイルを紐づけ、履歴は景品ごとに1件だけ保存
      const rs=st.results.filter(r=>r.pid===st.curPid&&r.sessBatch===st.batchId&&!r.arrayBuffer);
      rs.forEach(r=>{r.dlUrl=url;r.dlName=st.dlName;r.dlMime=st.dlMime;r.arrayBuffer=ab;});
      if(rs[0])savePrizeToHistory({...rs[0],count:rs.length},st.sessionId,st.sessionLabel).then(()=>{document.getElementById('histBtn').style.display='';});
    }else{
      st.dlUrl=url;
      if(st.currentResultIdx>=0){
        const r=st.results[st.currentResultIdx];
        r.dlUrl=url;r.dlName=st.dlName;r.dlMime=st.dlMime;r.arrayBuffer=ab;
        savePrizeToHistory(r,st.sessionId,st.sessionLabel).then(()=>{document.getElementById('histBtn').style.display='';});
      }
      st.fileDone=true;tryShowDl();
    }
  }catch(e){console.error('buildFile error:',e);}
  finally{
    if(inBatch){st.batchPending=Math.max(0,st.batchPending-1);st.chunks=[];onFileProgress();}
  }
}

function tryShowDl(){
  // オーバーレイが非表示なら何もしない（残留チャンクの誤作動防止）
  if(!document.getElementById('overlay').classList.contains('show'))return;
  if(!st.animDone||( st.pendingHasFile&&!st.fileDone))return;
  st.spinning=false;
  if(st.pendingHasFile&&st.dlUrl){
    const dlBtn=document.getElementById('dlBtn');
    dlBtn.className='dl-btn ready';
    dlBtn.onclick=()=>dlBlob(st.dlUrl,st.dlName);
  }
  if(st.remainingSpins>0){
    document.getElementById('nextBtn').className='again-btn ready';
    document.getElementById('skipOverlayBtn').className='skip-overlay-btn show';
    document.getElementById('skipAllBtn').className='skip-all-btn show';
  }else{
    document.getElementById('toResultsBtn').className='to-results-btn ready';
  }
  setGachaBtn(true);
}

function dlBlob(url,name){
  const a=document.createElement('a');a.href=url;a.download=name||'prize';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
}

function nextSpin(){
  if(!st.conn?.open)return;
  resetOverlay();
  st.animDone=false;st.fileDone=false;st.dlUrl=null;
  st.chunks=[];st.totalChunks=0;st.pendingHasFile=false;st.spinning=true;
  setGachaBtn(false);
  _spinTimeout=setTimeout(()=>{
    if(st.spinning&&!st.fastMode){forceCloseOverlay();alert('タイムアウト：ホストからの返答がありませんでした。');}
  },8000);
  st.conn.send({type:'spin_request'});
}

function forceCloseOverlay(){
  clearTimeout(_spinTimeout);st.fastMode=false;
  document.getElementById('overlay').classList.remove('show');
  // animDone/fileDone/pendingHasFile/dlUrl/chunks を全部リセット
  // しないと残留ファイルチャンクが届いた時に tryShowDl が誤作動する
  st.spinning=false;st.animDone=false;st.fileDone=false;
  st.pendingHasFile=false;st.dlUrl=null;st.chunks=[];st.totalChunks=0;
  resetOverlay();
  setGachaBtn(true);
}

function skipAll(){
  clearTimeout(_spinTimeout);st.fastMode=false;st.spinning=false;
  document.getElementById('overlay').classList.remove('show');
  showResults();
}

/* ===== まとめ引き：ホストが一括抽選 → 結果表を1回で受信 ===== */
function startFastSpin(){
  if(st.spinning||st.remainingSpins<=0||st.batchPending>0)return;
  if(!st.conn?.open){alert('ホストと接続されていません。');return;}
  st.fastMode=true;st.spinning=true;
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('fastSub').textContent='結果を受け取っています';
  document.getElementById('fastCancel').style.display='none';
  showScreen('screen-spinning');
  st.conn.send({type:'batch_request'});
  clearTimeout(_spinTimeout);
  _spinTimeout=setTimeout(()=>{
    if(st.fastMode){
      document.getElementById('fastSub').textContent='応答に時間がかかっています';
      document.getElementById('fastCancel').style.display='';
    }
  },10000);
}

function skipToFast(){startFastSpin();}

// 待たずに戻る：ホストは抽選済みの可能性があるので、結果が届いたら自動で結果画面を開く
function cancelFastMode(){
  clearTimeout(_spinTimeout);
  st.fastMode=false;
  showScreen('screen-gacha');setGachaBtn(false);
}

function onBatchResult(d){
  clearTimeout(_spinTimeout);
  st.fastMode=false;st.spinning=false;
  st.batchId++;
  st.remainingSpins=d.remainingSpins;
  document.getElementById('spinsNum').textContent=st.remainingSpins;
  d.seq.forEach(ti=>{
    const t=d.table[ti];
    st.results.push({pid:t.pid,ro:t.ro,sessBatch:st.batchId,rarity:t.rarity,
      prize:{pid:t.pid,name:t.name,text:t.text,hasFile:t.hasFile,fileName:t.fileName,mimeType:t.mimeType},
      dlUrl:null,dlName:null,dlMime:null,arrayBuffer:null,bonusAwarded:0});
  });
  st.batchPending=d.table.filter(t=>t.hasFile).length;
  showResults();
  setGachaBtn(true);
}

// ファイルが1つ届くたびに結果画面を更新。全部届いたらZIPを作る
function onFileProgress(){
  if(getCurrentScreen()==='screen-results'){
    renderResults();
    if(!(st.batchPending>0))prepareZip();
  }
  setGachaBtn(true);
}

/* ===== RESULTS ===== */
function showResults(){
  clearTimeout(_spinTimeout);st.fastMode=false;
  document.getElementById('overlay').classList.remove('show');
  renderResults();
  showScreen('screen-results');
  if(!(st.batchPending>0))prepareZip();
}

function dlGroup(i){const r=st.results[i];if(r&&r.dlUrl)dlBlob(r.dlUrl,r.dlName||'prize');}

function renderResults(){
  const list=document.getElementById('resultsList');
  const stats=document.getElementById('resultsStats');
  const btn=document.getElementById('batchDlBtn');
  const top=list.scrollTop;
  const hasFiles=st.results.some(r=>r.prize.hasFile);
  if(_zipUrl){URL.revokeObjectURL(_zipUrl);_zipUrl=null;}
  btn.style.display=hasFiles?'block':'none';
  btn.textContent=hasFiles?(st.batchPending>0?'ファイル受信中...':'ZIP準備中...'):'';
  btn.disabled=true;btn.onclick=null;

  const countMap={};
  st.results.forEach(r=>{const k=r.rarity.name;countMap[k]={count:(countMap[k]?.count||0)+1,color:r.rarity.color};});
  stats.innerHTML=`<span style="font-size:13px;color:var(--mute);font-weight:700;margin-right:4px;">全${st.results.length}回</span>`
    +Object.entries(countMap).map(([n,{count,color}])=>
      `<span class="rstat" style="background:${esc(color)}22;color:${esc(color)};">${esc(n)} ×${count}</span>`).join('');

  // 同じ景品は1行にまとめ、レアリティ順（ホストの並び順）で表示
  const groups=new Map();
  st.results.forEach((r,i)=>{
    const k=r.pid||(r.rarity.name+'|'+r.prize.name);
    const g=groups.get(k);if(g)g.n++;else groups.set(k,{r,i,n:1});
  });
  const rows=[...groups.values()].sort((a,b)=>(a.r.ro??99)-(b.r.ro??99));
  const visible=rows.slice(0,300);
  list.innerHTML=visible.map(({r,i,n})=>`
    <div class="result-item" style="box-shadow:inset 3px 0 0 ${esc(r.rarity.color)};">
      <span class="ri-badge" style="background:${esc(r.rarity.color)};">${esc(r.rarity.name)}</span>
      <div class="ri-info">
        <div class="ri-name">${esc(r.prize.name)}</div>
        ${r.prize.text?`<div class="ri-text">${esc(r.prize.text)}</div>`:''}
      </div>
      <div class="ri-actions">
        ${n>1?`<span class="ri-count">×${n}</span>`:''}
        ${r.dlUrl?`<button class="ri-dl" onclick="dlGroup(${i})">DL</button>`
                 :r.prize.hasFile?`<span class="ri-wait">受信中</span>`:''}
        ${r.prize.text?`<button class="ri-copy" onclick="copyText(${i},this)">コピー</button>`:''}
      </div>
    </div>`).join('')+
    (rows.length>300?`<div class="empty-history">表示は先頭300種類まで。抽選結果自体は全${rows.length}種類保持されています。</div>`:'');
  list.scrollTop=top;
}

async function prepareZip(){
  const btn=document.getElementById('batchDlBtn');
  const files=st.results.filter(r=>r.arrayBuffer);
  if(!files.length)return;

  // JSZip CDN未ロード時のフォールバック
  if(typeof JSZip==='undefined'){
    btn.textContent='個別DLをご利用ください（ZIP利用不可）';
    btn.disabled=true;return;
  }

  // 同じ景品(pid)の重複結果は1ファイルにまとめる。
  // 「ファイル名だけ」で重複判定すると、別景品の同名ファイルまで消えるため使わない。
  const byPrize=new Map();
  for(const r of files){
    const key=r.pid||`${r.rarity.name}|${r.prize.name}|${r.dlName}`;
    if(!byPrize.has(key))byPrize.set(key,r);
  }
  const unique=[...byPrize.values()];

  // ZIP内のファイル名衝突は別問題なので、必要な場合だけ連番を付ける。
  const usedNames=new Map();
  unique.forEach(r=>{
    const base=r.dlName||'prize';
    const count=usedNames.get(base)||0;
    usedNames.set(base,count+1);
    r._zipName=count?`${base.replace(/(\.[^.]*)?$/,(m,ext)=>`_${count+1}${ext||''}`)}`:base;
  });

  if(unique.length===1){
    if(_zipUrl){URL.revokeObjectURL(_zipUrl);_zipUrl=null;}
    const one=unique[0];
    btn.textContent='ファイルをダウンロード';btn.disabled=false;
    btn.onclick=()=>dlBlob(one.dlUrl,one.dlName||'prize');
    return;
  }

  // 複数：JSZipでまとめる
  try{
    const zip=new JSZip();
    for(const r of unique)zip.file(r._zipName||r.dlName||'prize',r.arrayBuffer);
    const content=await zip.generateAsync({type:'blob'},m=>{
      btn.textContent=`ZIP準備中... ${Math.round(m.percent)}%`;
    });
    if(_zipUrl)URL.revokeObjectURL(_zipUrl);
    _zipUrl=URL.createObjectURL(content);_zipName='gacha-prizes.zip';
    btn.textContent='全ファイルをまとめてDL（ZIP）';
    btn.disabled=false;
    btn.onclick=()=>dlBlob(_zipUrl,_zipName);
  }catch(e){
    console.error('prepareZip error:',e);
    btn.textContent='ZIP作成失敗 - 個別DLをご利用ください';btn.disabled=false;
  }
}

function copyText(idx,btn){
  const r=st.results[idx];if(!r?.prize.text)return;
  navigator.clipboard.writeText(r.prize.text).then(()=>{
    if(btn){const o=btn.textContent;btn.textContent='コピー済み';setTimeout(()=>btn.textContent=o,1500);}
  }).catch(()=>alert(r.prize.text));
}

function closeResults(){showScreen('screen-gacha');setGachaBtn(true);}

/* ===== HISTORY ===== */
async function showHistory(){
  await renderHistory();
  showScreen('screen-history');
}

async function renderHistory(){
  const list=document.getElementById('historyList');
  const all=await loadAllHistory().catch(()=>[]);
  if(!all.length){list.innerHTML='<div class="empty-history">保存された景品はありません</div>';return;}

  // セッションごとにグループ化
  const sessions={};
  all.sort((a,b)=>b.timestamp-a.timestamp).forEach(item=>{
    if(!sessions[item.sessionId])sessions[item.sessionId]={label:item.sessionLabel,items:[]};
    sessions[item.sessionId].items.push(item);
  });

  list.innerHTML=Object.entries(sessions).map(([sid,sess])=>`
    <div class="history-session">
      <div class="history-session-hdr">
        <span>${sess.label}</span>
        <span>${sess.items.length}件</span>
      </div>
      ${sess.items.map(item=>`
        <div class="history-item">
          <span class="hi-badge" style="background:${item.rarityColor};">${esc(item.rarityName)}</span>
          <div class="hi-info">
            <div class="hi-name">${esc(item.prizeName)}${item.count>1?' ×'+item.count:''}</div>
            ${item.prizeText?`<div class="hi-text">${esc(item.prizeText)}</div>`:''}
          </div>
          <div style="display:flex;gap:5px;flex-shrink:0;">
            ${item.hasFile?`<button class="hi-dl" onclick="dlFromHistory(${item.id})">DL</button>`:''}
            ${item.prizeText?`<button class="hi-copy" onclick="copyHistText(${item.id})">コピー</button>`:''}
          </div>
        </div>`).join('')}
    </div>`).join('');
}

async function dlFromHistory(id){
  const all=await loadAllHistory();
  const item=all.find(a=>a.id===id);
  if(!item||!item.arrayBuffer)return alert('ファイルデータが見つかりません');
  const blob=new Blob([item.arrayBuffer],{type:item.dlMime||'application/octet-stream'});
  const url=URL.createObjectURL(blob);
  dlBlob(url,item.dlName||'prize');
  // ダウンロード後にURLを解放
  setTimeout(()=>URL.revokeObjectURL(url),5000);
}

async function copyHistText(id){
  const all=await loadAllHistory();
  const item=all.find(a=>a.id===id);
  if(!item?.prizeText)return;
  navigator.clipboard.writeText(item.prizeText).catch(()=>alert(item.prizeText));
}

async function clearHistory(){
  if(!confirm('履歴をすべて削除しますか？'))return;
  await clearAllHistory();
  document.getElementById('histBtn').style.display='none';
  renderHistory();
}

/* ===== NAV ===== */
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');}
function setConnText(t){document.getElementById('connText').textContent=t;}

function showError(msg){
  document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden'));
  const err=document.createElement('div');err.className='screen';err.style.zIndex='20';
  err.innerHTML=`<div class="logo" style="font-size:clamp(18px,5vw,24px);margin-bottom:20px;">接続エラー</div>
    <div class="panel"><div class="error-box" style="white-space:pre-line">${msg}</div>
    <button class="submit-btn" onclick="location.reload()">再接続する</button></div>`;
  document.body.appendChild(err);
}

function submitName(){
  const name=document.getElementById('nameInput').value.trim();if(!name)return;
  const pinEl=document.getElementById('pinInput');
  const pin=st.pinRequired?(pinEl.value.trim().toUpperCase()||''):undefined;
  if(st.pinRequired&&!pin){
    document.getElementById('nameError').innerHTML='<div class="error-box">PINを入力してください。</div>';return;
  }
  st.name=name;document.getElementById('nameError').innerHTML='';
  if(st.conn?.open)st.conn.send({type:'identify',name,...(pin!==undefined&&{pin})});
}

document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!document.getElementById('screen-name').classList.contains('hidden'))submitName();
});
</script>
